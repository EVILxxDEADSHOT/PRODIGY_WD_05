<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Weather App</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="header">
    <h1>Weather App</h1>
  </header>

  <main>
    <section class="search-section">
      <input type="text" id="location-input" placeholder="Enter a city name" />
      <button id="search-button">Search</button>
      <button id="current-location-button">Use My Location</button>
    </section>

    <section id="weather-data" class="weather-section hidden">
      <h2>Weather in <span id="location-name"></span></h2>
      <p id="weather-description"></p>
      <p>Temperature: <span id="temperature"></span>°C</p>
      <p>Humidity: <span id="humidity"></span>%</p>
      <p>Wind Speed: <span id="wind-speed"></span> m/s</p>
    </section>

    <section id="error-message" class="error-message hidden">
      <p>Could not fetch weather data. Please try again!</p>
    </section>
  </main>

  <footer>
    <p>&copy; 2025 Weather App</p>
  </footer>

  <script src="script.js"></script>
</body>
</html>
